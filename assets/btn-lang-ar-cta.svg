<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 44" width="240" height="44" fill="none">
  <defs>
    <!-- Primary CTA Gradient -->
    <linearGradient id="arCtaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056D2"/>
      <stop offset="60%" stop-color="#1A6FE8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="arCtaBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="btnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
    </filter>
  </defs>

  <style>
    .font-ar {
      font-family: 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Almarai', 'Cairo', Arial, sans-serif;
    }
    @keyframes arrowBounce {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(4px); }
    }
    .arrow-icon {
      animation: arrowBounce 1.8s infinite ease-in-out;
    }
  </style>

  <!-- Ambient Glow Behind Button -->
  <rect x="8" y="6" width="224" height="32" rx="12" fill="#0056D2" opacity="0.35" filter="url(#btnGlow)"/>

  <!-- Button Frame -->
  <rect x="1" y="1" width="238" height="42" rx="12" fill="url(#arCtaGrad)" stroke="url(#arCtaBorder)" stroke-width="1.5"/>

  <!-- Left: Globe / Language Icon -->
  <g transform="translate(18, 12)">
    <circle cx="10" cy="10" r="9" stroke="#E0F2FE" stroke-width="1.4" fill="none"/>
    <ellipse cx="10" cy="10" rx="4.5" ry="9" stroke="#E0F2FE" stroke-width="1.3" fill="none"/>
    <line x1="1" y1="10" x2="19" y2="10" stroke="#E0F2FE" stroke-width="1.3"/>
  </g>

  <!-- Center Text: تصفح بالعربية -->
  <text x="122" y="27" text-anchor="middle" fill="#FFFFFF" font-size="14.5" font-weight="700" class="font-ar" letter-spacing="0.2">تصفح بالعربية</text>

  <!-- Right: Animated Arrow Icon -->
  <g class="arrow-icon" transform="translate(196, 14)">
    <path d="M2 8H18M18 8L12 2M18 8L12 14" stroke="#E0F2FE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
