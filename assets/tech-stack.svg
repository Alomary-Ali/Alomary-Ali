<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" width="100%" height="250" fill="none">
  <defs>
    <!-- Coursera Deep Space Navy Gradient -->
    <linearGradient id="crTsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A"/>
      <stop offset="50%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>

    <!-- Card Fill Surface -->
    <linearGradient id="crCardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1A33" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#071022" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Coursera Header Gradient -->
    <linearGradient id="crHeadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>

    <!-- Card Borders with Coursera Royal Blue Glow -->
    <linearGradient id="bBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056D2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Technical Dot Grid -->
    <pattern id="crTsDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="0.7" fill="#3B82F6" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }

    @keyframes pulseGlow {
      0%, 100% { stroke-opacity: 0.5; }
      50% { stroke-opacity: 0.95; }
    }
    .cr-card-border { animation: pulseGlow 4s infinite ease-in-out; }
  </style>

  <!-- Container Base -->
  <rect x="1.5" y="1.5" width="937" height="247" rx="16" fill="url(#crTsBg)" stroke="#1E3A8A" stroke-width="1.3"/>
  <rect x="3" y="3" width="934" height="244" rx="15" fill="url(#crTsDots)"/>

  <!-- Top Title Bar -->
  <g transform="translate(28, 20)">
    <circle cx="4" cy="6" r="3.5" fill="#0056D2"/>
    <text x="16" y="10" fill="url(#crHeadGrad)" font-size="11" font-weight="700" class="font-mono" letter-spacing="1.5">SPECIALIZED TECHNICAL DOMAINS &amp; ARSENAL</text>
    <text x="884" y="10" text-anchor="end" fill="#60A5FA" font-size="10.5" font-weight="600" class="font-mono">COURSERA-ALIGNED STANDARDS</text>
  </g>

  <!-- ================= GRID ROW 1 ================= -->

  <!-- CARD 1: Mobile Engineering (Flutter & Dart) -->
  <g transform="translate(28, 44)">
    <rect class="cr-card-border" x="0" y="0" width="276" height="88" rx="10" fill="url(#crCardSurface)" stroke="url(#bBlue)" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <!-- Official Flutter Vector Icon -->
      <g transform="translate(0, 0) scale(0.85)">
        <path d="M14.314 0L2.3 12 6 15.7 21.684.013h-7.37z" fill="#54C5F8"/>
        <path d="M14.287 10.978L6.46 18.807 10.16 22.507 17.986 14.678h-3.699z" fill="#29B6F6"/>
        <path d="M10.158 22.508L14.288 26.638H21.688L14.774 19.724 10.158 22.508z" fill="#01579B"/>
        <path d="M14.774 19.724L17.986 14.678H21.686L17.572 18.792z" fill="#0288D1"/>
      </g>
      <text x="30" y="15" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Mobile Engineering</text>
      <text x="0" y="38" fill="#38BDF8" font-size="10.5" font-weight="600" class="font-mono">FLUTTER • DART</text>
      <text x="0" y="54" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">State Management • iOS &amp; Android</text>
    </g>
  </g>

  <!-- CARD 2: Backend Core (Laravel & PHP) -->
  <g transform="translate(332, 44)">
    <rect class="cr-card-border" x="0" y="0" width="276" height="88" rx="10" fill="url(#crCardSurface)" stroke="url(#bBlue)" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <!-- Official Laravel Vector Icon -->
      <g transform="translate(0, 0) scale(0.8)">
        <path d="M2.5 7.5L12 2L21.5 7.5V18.5L12 24L2.5 18.5V7.5Z" fill="#FF2D20"/>
        <path d="M12 2V24M2.5 7.5L21.5 18.5M2.5 18.5L21.5 7.5" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5"/>
      </g>
      <text x="30" y="15" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Backend &amp; APIs</text>
      <text x="0" y="38" fill="#FB7185" font-size="10.5" font-weight="600" class="font-mono">LARAVEL • PHP</text>
      <text x="0" y="54" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">RESTful APIs • Business Logic &amp; RBAC</text>
    </g>
  </g>

  <!-- CARD 3: Architecture & Patterns -->
  <g transform="translate(636, 44)">
    <rect class="cr-card-border" x="0" y="0" width="276" height="88" rx="10" fill="url(#crCardSurface)" stroke="url(#bBlue)" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <!-- Modern Architecture Vector Symbol -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="20" height="20" rx="4" fill="#0056D2" fill-opacity="0.3"/>
        <path d="M4 16L10 5L16 16H4Z" stroke="#60A5FA" stroke-width="1.4" fill="none"/>
        <circle cx="10" cy="12" r="1.5" fill="#38BDF8"/>
      </g>
      <text x="30" y="15" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Software Architecture</text>
      <text x="0" y="38" fill="#93C5FD" font-size="10.5" font-weight="600" class="font-mono">CLEAN ARCHITECTURE</text>
      <text x="0" y="54" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">Feature-First • MVC • SOLID Principles</text>
    </g>
  </g>

  <!-- ================= GRID ROW 2 ================= -->

  <!-- CARD 4: Database & Modeling (MySQL) -->
  <g transform="translate(28, 142)">
    <rect class="cr-card-border" x="0" y="0" width="276" height="88" rx="10" fill="url(#crCardSurface)" stroke="url(#bBlue)" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <!-- Official MySQL Vector Storage Icon -->
      <g transform="translate(0, 0) scale(0.9)">
        <ellipse cx="10" cy="5" rx="9" ry="3.5" fill="#00758F"/>
        <path d="M1 5V13C1 15 5 16.5 10 16.5C15 16.5 19 15 19 13V5" stroke="#F29111" stroke-width="1.8" fill="none"/>
        <path d="M1 9C1 11 5 12.5 10 12.5C15 12.5 19 11 19 9" stroke="#00758F" stroke-width="1.4" fill="none"/>
      </g>
      <text x="30" y="15" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Database &amp; Storage</text>
      <text x="0" y="38" fill="#FBBF24" font-size="10.5" font-weight="600" class="font-mono">MYSQL</text>
      <text x="0" y="54" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">Relational Modeling • Query Optimization</text>
    </g>
  </g>

  <!-- CARD 5: UI/UX & Prototyping (Figma) -->
  <g transform="translate(332, 142)">
    <rect class="cr-card-border" x="0" y="0" width="276" height="88" rx="10" fill="url(#crCardSurface)" stroke="url(#bBlue)" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <!-- Official Figma Vector Logo -->
      <g transform="translate(0, 0) scale(0.85)">
        <path d="M4 11C4 8.79 5.79 7 8 7H12V15H8C5.79 15 4 13.21 4 11Z" fill="#F24E1E"/>
        <path d="M12 7H16C18.21 7 20 8.79 20 11C20 13.21 18.21 15 16 15H12V7Z" fill="#FF7262"/>
        <path d="M12 15H16C18.21 15 20 16.79 20 19C20 21.21 18.21 23 16 23C13.79 23 12 21.21 12 19V15Z" fill="#1ABCFE"/>
        <path d="M4 19C4 16.79 5.79 15 8 15H12V23H8C5.79 23 4 21.21 4 19Z" fill="#0ACF83"/>
        <circle cx="8" cy="11" r="4" fill="#A259FF"/>
      </g>
      <text x="30" y="15" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">UI/UX &amp; Prototyping</text>
      <text x="0" y="38" fill="#C084FC" font-size="10.5" font-weight="600" class="font-mono">FIGMA SPEC</text>
      <text x="0" y="54" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">Pixel-Perfect • Design Systems • UX Flow</text>
    </g>
  </g>

  <!-- CARD 6: Workflow & AI Tools (Coursera, Git, Postman) -->
  <g transform="translate(636, 142)">
    <rect class="cr-card-border" x="0" y="0" width="276" height="88" rx="10" fill="url(#crCardSurface)" stroke="url(#bBlue)" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <!-- Coursera & Git Vector Mark -->
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="9" fill="#0056D2"/>
        <path d="M13 6.5C12.2 6.2 11.2 6 10 6C7.5 6 5.5 8 5.5 10.5C5.5 13 7.5 15 10 15C11.2 15 12.2 14.8 13 14.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <text x="30" y="15" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Toolchain &amp; AI</text>
      <text x="0" y="38" fill="#38BDF8" font-size="10.5" font-weight="600" class="font-mono">GIT • POSTMAN • AI</text>
      <text x="0" y="54" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">Coursera Certified • AI Productivity</text>
    </g>
  </g>
</svg>
