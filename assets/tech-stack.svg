<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" width="100%" height="250" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="tsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#080E1D"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#070C16" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Border Gradients for Cards -->
    <linearGradient id="bCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="tsDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.6" fill="#334155" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; }

    @keyframes pulseCard {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .glow-border { animation: pulseCard 5s infinite ease-in-out; }
  </style>

  <!-- Container Base -->
  <rect x="1" y="1" width="938" height="248" rx="16" fill="url(#tsBg)" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="2" y="2" width="936" height="246" rx="15" fill="url(#tsDots)"/>

  <!-- Top Title Bar -->
  <g transform="translate(28, 20)">
    <circle cx="4" cy="6" r="3" fill="#38BDF8"/>
    <text x="16" y="10" fill="url(#headerGrad)" font-size="11" font-weight="700" class="font-mono" letter-spacing="1.5">SPECIALIZED TECHNICAL DOMAINS &amp; ARSENAL</text>
    <text x="884" y="10" text-anchor="end" fill="#64748B" font-size="10.5" font-weight="500" class="font-mono">SENIOR ENGINEERING STANDARD</text>
  </g>

  <!-- ================= GRID ROW 1 ================= -->

  <!-- CARD 1: Mobile Engineering (Cyan) -->
  <g transform="translate(28, 44)">
    <rect class="glow-border" x="0" y="0" width="276" height="88" rx="10" fill="url(#cardFill)" stroke="url(#bCyan)" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <rect x="0" y="0" width="22" height="22" rx="5" fill="#082F49" stroke="#38BDF8" stroke-width="1"/>
      <path d="M7 6H15M7 16H15M9 4H13C13.5 4 14 4.5 14 5V17C14 17.5 13.5 18 13 18H9C8.5 18 8 17.5 8 17V5C8 4.5 8.5 4 9 4Z" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="30" y="15" fill="#F1F5F9" font-size="12" font-weight="700" class="font-sans">Mobile Engineering</text>
      <text x="0" y="38" fill="#38BDF8" font-size="10" font-weight="600" class="font-mono">FLUTTER • DART</text>
      <text x="0" y="54" fill="#94A3B8" font-size="10.5" font-weight="500" class="font-sans">State Management • iOS &amp; Android</text>
    </g>
  </g>

  <!-- CARD 2: Backend & APIs (Rose) -->
  <g transform="translate(332, 44)">
    <rect class="glow-border" x="0" y="0" width="276" height="88" rx="10" fill="url(#cardFill)" stroke="url(#bRose)" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <rect x="0" y="0" width="22" height="22" rx="5" fill="#4C0519" stroke="#F43F5E" stroke-width="1"/>
      <path d="M5 7H17M5 11H17M5 15H17" stroke="#F43F5E" stroke-width="1.4" stroke-linecap="round"/>
      <text x="30" y="15" fill="#F1F5F9" font-size="12" font-weight="700" class="font-sans">Backend &amp; APIs</text>
      <text x="0" y="38" fill="#FB7185" font-size="10" font-weight="600" class="font-mono">LARAVEL • PHP</text>
      <text x="0" y="54" fill="#94A3B8" font-size="10.5" font-weight="500" class="font-sans">RESTful APIs • Business Logic &amp; RBAC</text>
    </g>
  </g>

  <!-- CARD 3: Architecture & Patterns (Indigo) -->
  <g transform="translate(636, 44)">
    <rect class="glow-border" x="0" y="0" width="276" height="88" rx="10" fill="url(#cardFill)" stroke="url(#bIndigo)" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <rect x="0" y="0" width="22" height="22" rx="5" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
      <path d="M6 16L11 6L16 16H6Z" stroke="#818CF8" stroke-width="1.3"/>
      <text x="30" y="15" fill="#F1F5F9" font-size="12" font-weight="700" class="font-sans">Software Architecture</text>
      <text x="0" y="38" fill="#A5B4FC" font-size="10" font-weight="600" class="font-mono">CLEAN ARCHITECTURE</text>
      <text x="0" y="54" fill="#94A3B8" font-size="10.5" font-weight="500" class="font-sans">Feature-First • MVC • SOLID Principles</text>
    </g>
  </g>

  <!-- ================= GRID ROW 2 ================= -->

  <!-- CARD 4: Database & Modeling (Amber) -->
  <g transform="translate(28, 142)">
    <rect class="glow-border" x="0" y="0" width="276" height="88" rx="10" fill="url(#cardFill)" stroke="url(#bAmber)" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <rect x="0" y="0" width="22" height="22" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1"/>
      <ellipse cx="11" cy="8" rx="6" ry="2.5" stroke="#F59E0B" stroke-width="1.2"/>
      <path d="M5 8V14C5 15.4 7.7 16.5 11 16.5C14.3 16.5 17 15.4 17 14V8" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="30" y="15" fill="#F1F5F9" font-size="12" font-weight="700" class="font-sans">Database &amp; Schemas</text>
      <text x="0" y="38" fill="#FCD34D" font-size="10" font-weight="600" class="font-mono">MYSQL</text>
      <text x="0" y="54" fill="#94A3B8" font-size="10.5" font-weight="500" class="font-sans">Relational Modeling • Query Optimization</text>
    </g>
  </g>

  <!-- CARD 5: UI/UX & Design Systems (Purple) -->
  <g transform="translate(332, 142)">
    <rect class="glow-border" x="0" y="0" width="276" height="88" rx="10" fill="url(#cardFill)" stroke="url(#bPurple)" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <rect x="0" y="0" width="22" height="22" rx="5" fill="#2E1065" stroke="#C084FC" stroke-width="1"/>
      <path d="M7 11C7 9.3 8.3 8 10 8H14V14H10C8.3 14 7 12.7 7 11Z" stroke="#C084FC" stroke-width="1.2"/>
      <circle cx="11" cy="15" r="2" stroke="#C084FC" stroke-width="1.2"/>
      <text x="30" y="15" fill="#F1F5F9" font-size="12" font-weight="700" class="font-sans">UI/UX &amp; Prototyping</text>
      <text x="0" y="38" fill="#E9D5FF" font-size="10" font-weight="600" class="font-mono">FIGMA SPEC</text>
      <text x="0" y="54" fill="#94A3B8" font-size="10.5" font-weight="500" class="font-sans">Pixel-Perfect • Design Systems • UX Flow</text>
    </g>
  </g>

  <!-- CARD 6: Toolchain & AI Workflows (Emerald) -->
  <g transform="translate(636, 142)">
    <rect class="glow-border" x="0" y="0" width="276" height="88" rx="10" fill="url(#cardFill)" stroke="url(#bEmerald)" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <rect x="0" y="0" width="22" height="22" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
      <path d="M7 8L11 12L7 16M13 16H16" stroke="#10B981" stroke-width="1.4" stroke-linecap="round"/>
      <text x="30" y="15" fill="#F1F5F9" font-size="12" font-weight="700" class="font-sans">Workflow &amp; Tooling</text>
      <text x="0" y="38" fill="#6EE7B7" font-size="10" font-weight="600" class="font-mono">GIT • POSTMAN • AI</text>
      <text x="0" y="54" fill="#94A3B8" font-size="10.5" font-weight="500" class="font-sans">GitHub • API Testing • AI Acceleration</text>
    </g>
  </g>
</svg>
