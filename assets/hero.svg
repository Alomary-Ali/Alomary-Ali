<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="300" fill="none">
  <defs>
    <!-- Coursera Deep Navy Background -->
    <linearGradient id="crBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060E1D"/>
      <stop offset="40%" stop-color="#0A162C"/>
      <stop offset="80%" stop-color="#0D1C38"/>
      <stop offset="100%" stop-color="#040914"/>
    </linearGradient>

    <!-- Coursera Blue Core Gradient -->
    <linearGradient id="crBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0056D2"/>
      <stop offset="50%" stop-color="#1E70E8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Card Border Highlight -->
    <linearGradient id="crBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056D2" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#2563EB" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0056D2" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Ambient Coursera Blue Glow Filter -->
    <filter id="crAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="36" result="blur"/>
    </filter>

    <!-- Subtle Technical Grid Pattern -->
    <pattern id="crGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.8" fill="#3B82F6" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace;
    }

    /* Soft Atmospheric Aura Pulse */
    @keyframes pulseAura {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.06); }
    }
    .aura-circle {
      animation: pulseAura 8s infinite ease-in-out;
      transform-origin: 200px 120px;
    }

    /* Live Status Ping */
    @keyframes livePing {
      0% { r: 3.5px; opacity: 1; }
      70%, 100% { r: 11px; opacity: 0; }
    }
    .ping-circle {
      animation: livePing 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
      transform-origin: 752px 38px;
    }

    /* Smooth Dynamic Roles Carousel */
    @keyframes cycleRole1 {
      0%, 20% { opacity: 1; transform: translateY(0px); }
      24%, 96% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0px); }
    }
    @keyframes cycleRole2 {
      0%, 21% { opacity: 0; transform: translateY(-8px); }
      25%, 45% { opacity: 1; transform: translateY(0px); }
      49%, 100% { opacity: 0; transform: translateY(8px); }
    }
    @keyframes cycleRole3 {
      0%, 46% { opacity: 0; transform: translateY(-8px); }
      50%, 70% { opacity: 1; transform: translateY(0px); }
      74%, 100% { opacity: 0; transform: translateY(8px); }
    }
    @keyframes cycleRole4 {
      0%, 71% { opacity: 0; transform: translateY(-8px); }
      75%, 95% { opacity: 1; transform: translateY(0px); }
      99%, 100% { opacity: 0; transform: translateY(8px); }
    }

    .role-text-1 { animation: cycleRole1 16s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .role-text-2 { animation: cycleRole2 16s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .role-text-3 { animation: cycleRole3 16s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .role-text-4 { animation: cycleRole4 16s infinite cubic-bezier(0.16, 1, 0.3, 1); }
  </style>

  <!-- Atmospheric Glow Field -->
  <circle class="aura-circle" cx="190" cy="110" r="160" fill="#0056D2" filter="url(#crAura)"/>
  <circle class="aura-circle" cx="770" cy="180" r="150" fill="#0284C7" filter="url(#crAura)"/>

  <!-- Canvas Frame -->
  <rect x="1.5" y="1.5" width="957" height="297" rx="20" fill="url(#crBg)" stroke="url(#crBorder)" stroke-width="1.5"/>
  <rect x="3" y="3" width="954" height="294" rx="18" fill="url(#crGrid)"/>

  <!-- Top Navigation & Brand Bar -->
  <g transform="translate(36, 26)">
    <!-- Terminal Indicators -->
    <circle cx="6" cy="12" r="4.5" fill="#EF4444" fill-opacity="0.85"/>
    <circle cx="22" cy="12" r="4.5" fill="#F59E0B" fill-opacity="0.85"/>
    <circle cx="38" cy="12" r="4.5" fill="#10B981" fill-opacity="0.85"/>

    <!-- Coursera-Inspired Verified Identity Pill -->
    <g transform="translate(60, 0)">
      <rect x="0" y="0" width="190" height="24" rx="12" fill="#0056D2" fill-opacity="0.2" stroke="#0056D2" stroke-width="1"/>
      <path d="M12 7L16 11L24 5" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="16" fill="#93C5FD" font-size="11" font-weight="700" class="font-sans" letter-spacing="0.5">VERIFIED FULL-STACK</text>
    </g>
  </g>

  <!-- Live Status Badge (Top-Right) -->
  <g transform="translate(714, 26)">
    <rect x="0" y="0" width="210" height="26" rx="13" fill="#061224" stroke="#0056D2" stroke-width="1"/>
    <!-- Radar Waves -->
    <circle class="ping-circle" cx="18" cy="13" r="3.5" stroke="#38BDF8" stroke-width="1.4" fill="none"/>
    <circle cx="18" cy="13" r="3.5" fill="#38BDF8"/>
    <text x="32" y="17" fill="#E0F2FE" font-size="10.5" font-weight="700" class="font-mono" letter-spacing="0.8">AVAILABLE FOR WORK</text>
  </g>

  <!-- Hairline Divider -->
  <line x1="36" y1="64" x2="924" y2="64" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.6"/>

  <!-- ================= MAIN IDENTITY CONTENT ================= -->

  <!-- Brand Avatar / Coursera-Style Professional Monogram -->
  <g transform="translate(42, 92)">
    <rect x="0" y="0" width="78" height="78" rx="20" fill="#08152B" stroke="#0056D2" stroke-width="2"/>
    <!-- Real Geometric Monogram Vector -->
    <path d="M22 54L39 22L56 54" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M27 44H51" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <!-- Coursera Blue Accent Arc -->
    <path d="M50 42C56 36 62 42 59 49L64 54" stroke="#0056D2" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Name & Animated Specialty -->
  <g transform="translate(138, 112)">
    <!-- Subtitle Category Tag -->
    <text x="0" y="2" fill="#60A5FA" font-size="11" font-weight="700" class="font-mono" letter-spacing="2">FULL-STACK ENGINEER • MOBILE &amp; BACKEND ARCHITECT</text>

    <!-- Primary Name -->
    <text x="0" y="38" fill="#FFFFFF" font-size="34" font-weight="800" class="font-sans" letter-spacing="-0.5">Ali Qaid Saeed Alomary</text>

    <!-- Animated Dynamic Carousel -->
    <!-- Slide 1 -->
    <g class="role-text-1">
      <text x="0" y="66" fill="#F8FAFC" font-size="14.5" font-weight="600" class="font-sans">
        <tspan fill="#38BDF8">Flutter Mobile</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#60A5FA">Laravel Backend</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#CBD5E1">Clean Architecture &amp; RESTful APIs</tspan>
      </text>
    </g>
    <!-- Slide 2 -->
    <g class="role-text-2">
      <text x="0" y="66" fill="#F8FAFC" font-size="14.5" font-weight="600" class="font-sans">
        <tspan fill="#93C5FD">Clean Architecture Advocate</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#CBD5E1">Feature-First Structure &amp; SOLID Principles</tspan>
      </text>
    </g>
    <!-- Slide 3 -->
    <g class="role-text-3">
      <text x="0" y="66" fill="#F8FAFC" font-size="14.5" font-weight="600" class="font-sans">
        <tspan fill="#38BDF8">Enterprise Backend Core</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#CBD5E1">High-Throughput APIs &amp; Optimized MySQL Schemas</tspan>
      </text>
    </g>
    <!-- Slide 4 -->
    <g class="role-text-4">
      <text x="0" y="66" fill="#F8FAFC" font-size="14.5" font-weight="600" class="font-sans">
        <tspan fill="#A78BFA">Pixel-Perfect UI/UX</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#CBD5E1">Translating Figma Design Systems into Fluid Flutter Apps</tspan>
      </text>
    </g>
  </g>

  <!-- ================= REAL OFFICIAL VECTOR ICONS PILL ROW ================= -->
  <g transform="translate(42, 220)">
    
    <!-- 1. FLUTTER (Official Logo Vector) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="138" height="42" rx="10" fill="#0A1832" stroke="#0056D2" stroke-width="1.2"/>
      <!-- Official Flutter Vector Icon -->
      <g transform="translate(14, 11) scale(0.85)">
        <path d="M14.314 0L2.3 12 6 15.7 21.684.013h-7.37z" fill="#54C5F8"/>
        <path d="M14.287 10.978L6.46 18.807 10.16 22.507 17.986 14.678h-3.699z" fill="#29B6F6"/>
        <path d="M10.158 22.508L14.288 26.638H21.688L14.774 19.724 10.158 22.508z" fill="#01579B"/>
        <path d="M14.774 19.724L17.986 14.678H21.686L17.572 18.792z" fill="#0288D1"/>
      </g>
      <text x="42" y="21" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Flutter</text>
      <text x="42" y="33" fill="#60A5FA" font-size="9.5" font-weight="600" class="font-mono">Mobile App</text>
    </g>

    <!-- 2. LARAVEL (Official Logo Vector) -->
    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="138" height="42" rx="10" fill="#0A1832" stroke="#0056D2" stroke-width="1.2"/>
      <!-- Official Laravel Vector Icon -->
      <g transform="translate(14, 11) scale(0.85)">
        <path d="M2.5 7.5L12 2L21.5 7.5V18.5L12 24L2.5 18.5V7.5Z" fill="#FF2D20"/>
        <path d="M12 2V24M2.5 7.5L21.5 18.5M2.5 18.5L21.5 7.5" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5"/>
      </g>
      <text x="42" y="21" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Laravel</text>
      <text x="42" y="33" fill="#FB7185" font-size="9.5" font-weight="600" class="font-mono">Backend Core</text>
    </g>

    <!-- 3. MYSQL (Official Storage Vector) -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="138" height="42" rx="10" fill="#0A1832" stroke="#0056D2" stroke-width="1.2"/>
      <!-- Modern Database Icon -->
      <g transform="translate(14, 12)">
        <ellipse cx="10" cy="5" rx="9" ry="3.5" fill="#00758F"/>
        <path d="M1 5V13C1 15 5 16.5 10 16.5C15 16.5 19 15 19 13V5" stroke="#F29111" stroke-width="1.8" fill="none"/>
        <path d="M1 9C1 11 5 12.5 10 12.5C15 12.5 19 11 19 9" stroke="#00758F" stroke-width="1.4" fill="none"/>
      </g>
      <text x="42" y="21" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">MySQL</text>
      <text x="42" y="33" fill="#FBBF24" font-size="9.5" font-weight="600" class="font-mono">Relational DB</text>
    </g>

    <!-- 4. FIGMA (Official Logo Vector) -->
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="138" height="42" rx="10" fill="#0A1832" stroke="#0056D2" stroke-width="1.2"/>
      <!-- Official Figma Vector Shapes -->
      <g transform="translate(16, 11) scale(0.9)">
        <path d="M4 11C4 8.79 5.79 7 8 7H12V15H8C5.79 15 4 13.21 4 11Z" fill="#F24E1E"/>
        <path d="M12 7H16C18.21 7 20 8.79 20 11C20 13.21 18.21 15 16 15H12V7Z" fill="#FF7262"/>
        <path d="M12 15H16C18.21 15 20 16.79 20 19C20 21.21 18.21 23 16 23C13.79 23 12 21.21 12 19V15Z" fill="#1ABCFE"/>
        <path d="M4 19C4 16.79 5.79 15 8 15H12V23H8C5.79 23 4 21.21 4 19Z" fill="#0ACF83"/>
        <circle cx="8" cy="11" r="4" fill="#A259FF"/>
      </g>
      <text x="42" y="21" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Figma</text>
      <text x="42" y="33" fill="#C084FC" font-size="9.5" font-weight="600" class="font-mono">UI/UX Design</text>
    </g>

    <!-- 5. COURSERA CERTIFIED (Official Blue & White Vector Mark) -->
    <g transform="translate(600, 0)">
      <rect x="0" y="0" width="158" height="42" rx="10" fill="#0056D2" fill-opacity="0.18" stroke="#0056D2" stroke-width="1.2"/>
      <!-- Coursera 'C' Vector Emblem -->
      <g transform="translate(14, 11)">
        <circle cx="10" cy="10" r="9" fill="#0056D2"/>
        <path d="M13 6.5C12.2 6.2 11.2 6 10 6C7.5 6 5.5 8 5.5 10.5C5.5 13 7.5 15 10 15C11.2 15 12.2 14.8 13 14.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="40" y="21" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Coursera</text>
      <text x="40" y="33" fill="#93C5FD" font-size="9.5" font-weight="600" class="font-mono">Certified AI &amp; UX</text>
    </g>

    <!-- Location Pill -->
    <g transform="translate(770, 0)">
      <rect x="0" y="0" width="148" height="42" rx="10" fill="#060E1D" stroke="#1E3A8A" stroke-width="1"/>
      <text x="74" y="20" text-anchor="middle" fill="#E2E8F0" font-size="11.5" font-weight="600" class="font-sans">Sana'a, Yemen</text>
      <text x="74" y="32" text-anchor="middle" fill="#60A5FA" font-size="9.5" font-weight="500" class="font-mono">UTC+3 • Remote</text>
    </g>

  </g>
</svg>
