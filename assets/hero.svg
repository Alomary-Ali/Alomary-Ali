<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="280" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#0E1420"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="15%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="microGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#334155" fill-opacity="0.45"/>
    </pattern>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, Consolas, 'Courier New', monospace;
    }

    /* Animated text carousel keyframes */
    @keyframes slide1 {
      0%, 20% { opacity: 1; transform: translateY(0px); }
      24%, 96% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0px); }
    }
    @keyframes slide2 {
      0%, 21% { opacity: 0; transform: translateY(-6px); }
      25%, 45% { opacity: 1; transform: translateY(0px); }
      49%, 100% { opacity: 0; transform: translateY(6px); }
    }
    @keyframes slide3 {
      0%, 46% { opacity: 0; transform: translateY(-6px); }
      50%, 70% { opacity: 1; transform: translateY(0px); }
      74%, 100% { opacity: 0; transform: translateY(6px); }
    }
    @keyframes slide4 {
      0%, 71% { opacity: 0; transform: translateY(-6px); }
      75%, 95% { opacity: 1; transform: translateY(0px); }
      99%, 100% { opacity: 0; transform: translateY(6px); }
    }

    .slide-text-1 { animation: slide1 16s infinite ease-in-out; }
    .slide-text-2 { animation: slide2 16s infinite ease-in-out; }
    .slide-text-3 { animation: slide3 16s infinite ease-in-out; }
    .slide-text-4 { animation: slide4 16s infinite ease-in-out; }

    /* Blinking status dot */
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .pulse-dot {
      animation: pulseDot 2.2s infinite ease-in-out;
      transform-origin: 730px 42px;
    }

    /* Ambient pulse on top border */
    @keyframes borderShift {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }
    .border-glow {
      animation: borderShift 4s infinite ease-in-out;
    }
  </style>

  <!-- Background Base with Rounded Corners -->
  <rect x="1" y="1" width="918" height="278" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
  
  <!-- Subtle Grid Overlay -->
  <rect x="2" y="2" width="916" height="276" rx="15" fill="url(#microGrid)"/>

  <!-- Radial Glow Orbs -->
  <rect x="2" y="2" width="916" height="276" rx="15" fill="url(#glowLeft)"/>
  <rect x="2" y="2" width="916" height="276" rx="15" fill="url(#glowRight)"/>

  <!-- Top Accent Bar (Gradient line) -->
  <rect class="border-glow" x="16" y="1" width="888" height="2" fill="url(#accentGrad)" rx="1"/>

  <!-- Window Header / Terminal Controls -->
  <g transform="translate(36, 36)">
    <!-- Terminal dots -->
    <circle cx="0" cy="6" r="4.5" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="16" cy="6" r="4.5" fill="#F59E0B" fill-opacity="0.8"/>
    <circle cx="32" cy="6" r="4.5" fill="#10B981" fill-opacity="0.8"/>
    <!-- Terminal prompt title -->
    <text x="52" y="10" fill="#64748B" font-size="12" font-weight="500" class="font-mono">alomary.dev / full-stack-profile</text>
  </g>

  <!-- Status Badge (Right) -->
  <g transform="translate(680, 28)">
    <rect x="0" y="0" width="204" height="26" rx="13" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
    <circle class="pulse-dot" cx="16" cy="13" r="4" fill="#10B981"/>
    <text x="30" y="17" fill="#34D399" font-size="11" font-weight="600" class="font-mono" letter-spacing="0.4">AVAILABLE FOR WORK</text>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="64" x2="884" y2="64" stroke="#1E293B" stroke-width="1" stroke-opacity="0.7"/>

  <!-- Main Hero Content -->
  <!-- Monogram Glyph -->
  <g transform="translate(40, 92)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#111827" stroke="url(#accentGrad)" stroke-width="1.5"/>
    <!-- Code Brackets Icon -->
    <path d="M22 20L14 28L22 36" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 20L42 28L34 36" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 18L26 38" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Name & Title Section -->
  <g transform="translate(112, 114)">
    <!-- Primary Name -->
    <text x="0" y="16" fill="url(#nameGrad)" font-size="32" font-weight="800" class="font-sans" letter-spacing="-0.5">Ali Qaid Saeed Alomary</text>

    <!-- Subtitle Carousel (Animated) -->
    <!-- Slide 1 -->
    <g class="slide-text-1">
      <text x="0" y="44" fill="#38BDF8" font-size="15" font-weight="600" class="font-mono">
        <tspan fill="#38BDF8">Full-Stack Developer</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#E2E8F0">Flutter (Mobile) + Laravel (Backend)</tspan>
      </text>
    </g>
    <!-- Slide 2 -->
    <g class="slide-text-2">
      <text x="0" y="44" fill="#818CF8" font-size="15" font-weight="600" class="font-mono">
        <tspan fill="#818CF8">Architecture Focus</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#E2E8F0">Clean Architecture &amp; Feature-First Design</tspan>
      </text>
    </g>
    <!-- Slide 3 -->
    <g class="slide-text-3">
      <text x="0" y="44" fill="#F43F5E" font-size="15" font-weight="600" class="font-mono">
        <tspan fill="#F43F5E">Backend Engineering</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#E2E8F0">Secure RESTful APIs &amp; MySQL Modeling</tspan>
      </text>
    </g>
    <!-- Slide 4 -->
    <g class="slide-text-4">
      <text x="0" y="44" fill="#A855F7" font-size="15" font-weight="600" class="font-mono">
        <tspan fill="#A855F7">Pixel-Perfect UI</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#E2E8F0">Figma to Interactive Flutter Apps</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Tech Stack Pills (Precision Badges) -->
  <g transform="translate(40, 206)">
    <!-- Flutter Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="102" height="32" rx="8" fill="#0E1726" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="16" cy="16" r="3.5" fill="#38BDF8"/>
      <text x="28" y="20" fill="#E0F2FE" font-size="12" font-weight="600" class="font-sans">Flutter</text>
    </g>

    <!-- Laravel Badge -->
    <g transform="translate(114, 0)">
      <rect x="0" y="0" width="106" height="32" rx="8" fill="#1C1017" stroke="#F43F5E" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="16" cy="16" r="3.5" fill="#F43F5E"/>
      <text x="28" y="20" fill="#FFE4E6" font-size="12" font-weight="600" class="font-sans">Laravel</text>
    </g>

    <!-- MySQL Badge -->
    <g transform="translate(232, 0)">
      <rect x="0" y="0" width="98" height="32" rx="8" fill="#18181B" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="16" cy="16" r="3.5" fill="#F59E0B"/>
      <text x="28" y="20" fill="#FEF3C7" font-size="12" font-weight="600" class="font-sans">MySQL</text>
    </g>

    <!-- Clean Architecture Badge -->
    <g transform="translate(342, 0)">
      <rect x="0" y="0" width="168" height="32" rx="8" fill="#131424" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="16" cy="16" r="3.5" fill="#818CF8"/>
      <text x="28" y="20" fill="#E0E7FF" font-size="12" font-weight="600" class="font-sans">Clean Architecture</text>
    </g>

    <!-- REST APIs Badge -->
    <g transform="translate(522, 0)">
      <rect x="0" y="0" width="124" height="32" rx="8" fill="#0C1B24" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="16" cy="16" r="3.5" fill="#06B6D4"/>
      <text x="28" y="20" fill="#CFFAFE" font-size="12" font-weight="600" class="font-sans">RESTful APIs</text>
    </g>

    <!-- Figma Badge -->
    <g transform="translate(658, 0)">
      <rect x="0" y="0" width="94" height="32" rx="8" fill="#181324" stroke="#A855F7" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="16" cy="16" r="3.5" fill="#A855F7"/>
      <text x="28" y="20" fill="#F3E8FF" font-size="12" font-weight="600" class="font-sans">Figma</text>
    </g>

    <!-- Location / Timezone Indicator -->
    <g transform="translate(764, 0)">
      <text x="110" y="20" text-anchor="end" fill="#64748B" font-size="11" font-weight="500" class="font-mono">Sana'a • UTC+3</text>
    </g>
  </g>
</svg>
