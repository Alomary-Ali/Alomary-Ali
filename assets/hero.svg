<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="100%" height="290" fill="none">
  <defs>
    <!-- Luxury Deep Obsidian Surface (Harmonizes seamlessly with GitHub Dark) -->
    <linearGradient id="luxuryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B101B"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>

    <!-- Cinematic Coursera Royal Blue Spotlights -->
    <radialGradient id="spotlightLeft" cx="22%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#0056D2" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#0056D2" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0056D2" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="spotlightRight" cx="82%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Hairline Reflective Glass Border -->
    <linearGradient id="glassHairline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#0056D2" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0056D2" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Subtle Micro Texture -->
    <pattern id="whisperDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.6" fill="#38BDF8" fill-opacity="0.12"/>
    </pattern>

    <!-- Blur Filter for Soft Aura -->
    <filter id="auraBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace;
    }

    /* Ambient Spotlight Breathing */
    @keyframes spotlightBreathe {
      0%, 100% { opacity: 0.65; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.08); }
    }
    .ambient-spot {
      animation: spotlightBreathe 8s infinite ease-in-out;
      transform-origin: 220px 110px;
    }

    /* Live Radar Pulse */
    @keyframes radarWave {
      0% { r: 3.5px; opacity: 1; }
      70%, 100% { r: 12px; opacity: 0; }
    }
    .radar-pulse {
      animation: radarWave 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
      transform-origin: 754px 37px;
    }

    /* Dynamic Cycling Titles */
    @keyframes cycle1 {
      0%, 20% { opacity: 1; transform: translateY(0px); }
      24%, 96% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0px); }
    }
    @keyframes cycle2 {
      0%, 21% { opacity: 0; transform: translateY(-6px); }
      25%, 45% { opacity: 1; transform: translateY(0px); }
      49%, 100% { opacity: 0; transform: translateY(6px); }
    }
    @keyframes cycle3 {
      0%, 46% { opacity: 0; transform: translateY(-6px); }
      50%, 70% { opacity: 1; transform: translateY(0px); }
      74%, 100% { opacity: 0; transform: translateY(6px); }
    }
    @keyframes cycle4 {
      0%, 71% { opacity: 0; transform: translateY(-6px); }
      75%, 95% { opacity: 1; transform: translateY(0px); }
      99%, 100% { opacity: 0; transform: translateY(6px); }
    }

    .slide-1 { animation: cycle1 16s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .slide-2 { animation: cycle2 16s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .slide-3 { animation: cycle3 16s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .slide-4 { animation: cycle4 16s infinite cubic-bezier(0.16, 1, 0.3, 1); }
  </style>

  <!-- Ambient Light Orbs -->
  <circle class="ambient-spot" cx="210" cy="110" r="160" fill="#0056D2" opacity="0.18" filter="url(#auraBlur)"/>
  <circle class="ambient-spot" cx="780" cy="170" r="150" fill="#0284C7" opacity="0.12" filter="url(#auraBlur)"/>

  <!-- Canvas Surface with Ultra-Clean Hairline -->
  <rect x="1" y="1" width="958" height="288" rx="18" fill="url(#luxuryBg)" stroke="url(#glassHairline)" stroke-width="1.2"/>
  <rect x="2" y="2" width="956" height="286" rx="17" fill="url(#whisperDots)"/>
  <rect x="2" y="2" width="956" height="286" rx="17" fill="url(#spotlightLeft)"/>
  <rect x="2" y="2" width="956" height="286" rx="17" fill="url(#spotlightRight)"/>

  <!-- Top Glass Bar -->
  <g transform="translate(36, 25)">
    <!-- Terminal Indicators -->
    <circle cx="6" cy="12" r="4.5" fill="#EF4444" fill-opacity="0.85"/>
    <circle cx="22" cy="12" r="4.5" fill="#F59E0B" fill-opacity="0.85"/>
    <circle cx="38" cy="12" r="4.5" fill="#10B981" fill-opacity="0.85"/>

    <!-- Coursera-Inspired Verified Badge -->
    <g transform="translate(60, 0)">
      <rect x="0" y="0" width="194" height="24" rx="12" fill="#0056D2" fill-opacity="0.15" stroke="#0056D2" stroke-opacity="0.4" stroke-width="1"/>
      <path d="M12 7L16 11L24 5" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="16" fill="#93C5FD" font-size="11" font-weight="700" class="font-sans" letter-spacing="0.5">VERIFIED FULL-STACK</text>
    </g>
  </g>

  <!-- Live Status Badge (Top-Right) -->
  <g transform="translate(714, 25)">
    <rect x="0" y="0" width="210" height="26" rx="13" fill="#0B1220" stroke="#0056D2" stroke-opacity="0.5" stroke-width="1"/>
    <!-- Radar Waves -->
    <circle class="radar-pulse" cx="18" cy="13" r="3.5" stroke="#38BDF8" stroke-width="1.4" fill="none"/>
    <circle cx="18" cy="13" r="3.5" fill="#38BDF8"/>
    <text x="32" y="17" fill="#E2E8F0" font-size="10.5" font-weight="700" class="font-mono" letter-spacing="0.8">AVAILABLE FOR WORK</text>
  </g>

  <!-- Hairline Separation -->
  <line x1="36" y1="62" x2="924" y2="62" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6"/>

  <!-- ================= MAIN BRAND CONTENT ================= -->

  <!-- Coursera-Style Geometric Avatar Tile -->
  <g transform="translate(42, 88)">
    <rect x="0" y="0" width="76" height="76" rx="18" fill="#0E1626" stroke="#0056D2" stroke-width="1.8"/>
    <!-- Precision Monogram Vectors -->
    <path d="M22 52L38 22L54 52" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 43H50" stroke="#38BDF8" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Coursera Blue Emblem Accent -->
    <path d="M48 40C54 34 60 40 57 47L62 52" stroke="#0056D2" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- Typography Hierarchy -->
  <g transform="translate(136, 108)">
    <!-- Category Super-Title -->
    <text x="0" y="2" fill="#60A5FA" font-size="11" font-weight="700" class="font-mono" letter-spacing="2">FULL-STACK DEVELOPER • FLUTTER &amp; LARAVEL ARCHITECT</text>

    <!-- Primary Signature Name -->
    <text x="0" y="38" fill="#FFFFFF" font-size="33" font-weight="800" class="font-sans" letter-spacing="-0.5">Ali Qaid Saeed Alomary</text>

    <!-- Animated Dynamic Carousel -->
    <!-- Slide 1 -->
    <g class="slide-1">
      <text x="0" y="65" fill="#F8FAFC" font-size="14.5" font-weight="600" class="font-sans">
        <tspan fill="#38BDF8">Flutter Mobile</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#60A5FA">Laravel Backend</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#CBD5E1">Clean Architecture &amp; RESTful APIs</tspan>
      </text>
    </g>
    <!-- Slide 2 -->
    <g class="slide-2">
      <text x="0" y="65" fill="#F8FAFC" font-size="14.5" font-weight="600" class="font-sans">
        <tspan fill="#93C5FD">Clean Architecture Advocate</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#CBD5E1">Feature-First Pattern &amp; SOLID Principles</tspan>
      </text>
    </g>
    <!-- Slide 3 -->
    <g class="slide-3">
      <text x="0" y="65" fill="#F8FAFC" font-size="14.5" font-weight="600" class="font-sans">
        <tspan fill="#38BDF8">Enterprise Backend Core</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#CBD5E1">High-Throughput APIs &amp; Optimized MySQL Schemas</tspan>
      </text>
    </g>
    <!-- Slide 4 -->
    <g class="slide-4">
      <text x="0" y="65" fill="#F8FAFC" font-size="14.5" font-weight="600" class="font-sans">
        <tspan fill="#C084FC">Pixel-Perfect UI/UX</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#CBD5E1">Figma Design Systems into Fluid Cross-Platform Apps</tspan>
      </text>
    </g>
  </g>

  <!-- ================= BOTTOM FROSTED GLASS TECH CHIPS ================= -->
  <g transform="translate(42, 214)">
    
    <!-- 1. FLUTTER -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="138" height="42" rx="10" fill="#0C1322" stroke="#0056D2" stroke-opacity="0.4" stroke-width="1.2"/>
      <g transform="translate(14, 11) scale(0.85)">
        <path d="M14.314 0L2.3 12 6 15.7 21.684.013h-7.37z" fill="#54C5F8"/>
        <path d="M14.287 10.978L6.46 18.807 10.16 22.507 17.986 14.678h-3.699z" fill="#29B6F6"/>
        <path d="M10.158 22.508L14.288 26.638H21.688L14.774 19.724 10.158 22.508z" fill="#01579B"/>
        <path d="M14.774 19.724L17.986 14.678H21.686L17.572 18.792z" fill="#0288D1"/>
      </g>
      <text x="42" y="21" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Flutter</text>
      <text x="42" y="33" fill="#60A5FA" font-size="9.5" font-weight="600" class="font-mono">Mobile App</text>
    </g>

    <!-- 2. LARAVEL -->
    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="138" height="42" rx="10" fill="#0C1322" stroke="#0056D2" stroke-opacity="0.4" stroke-width="1.2"/>
      <g transform="translate(14, 11) scale(0.85)">
        <path d="M2.5 7.5L12 2L21.5 7.5V18.5L12 24L2.5 18.5V7.5Z" fill="#FF2D20"/>
        <path d="M12 2V24M2.5 7.5L21.5 18.5M2.5 18.5L21.5 7.5" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5"/>
      </g>
      <text x="42" y="21" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Laravel</text>
      <text x="42" y="33" fill="#FB7185" font-size="9.5" font-weight="600" class="font-mono">Backend Core</text>
    </g>

    <!-- 3. MYSQL -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="138" height="42" rx="10" fill="#0C1322" stroke="#0056D2" stroke-opacity="0.4" stroke-width="1.2"/>
      <g transform="translate(14, 12)">
        <ellipse cx="10" cy="5" rx="9" ry="3.5" fill="#00758F"/>
        <path d="M1 5V13C1 15 5 16.5 10 16.5C15 16.5 19 15 19 13V5" stroke="#F29111" stroke-width="1.8" fill="none"/>
        <path d="M1 9C1 11 5 12.5 10 12.5C15 12.5 19 11 19 9" stroke="#00758F" stroke-width="1.4" fill="none"/>
      </g>
      <text x="42" y="21" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">MySQL</text>
      <text x="42" y="33" fill="#FBBF24" font-size="9.5" font-weight="600" class="font-mono">Relational DB</text>
    </g>

    <!-- 4. FIGMA -->
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="138" height="42" rx="10" fill="#0C1322" stroke="#0056D2" stroke-opacity="0.4" stroke-width="1.2"/>
      <g transform="translate(16, 11) scale(0.9)">
        <path d="M4 11C4 8.79 5.79 7 8 7H12V15H8C5.79 15 4 13.21 4 11Z" fill="#F24E1E"/>
        <path d="M12 7H16C18.21 7 20 8.79 20 11C20 13.21 18.21 15 16 15H12V7Z" fill="#FF7262"/>
        <path d="M12 15H16C18.21 15 20 16.79 20 19C20 21.21 18.21 23 16 23C13.79 23 12 21.21 12 19V15Z" fill="#1ABCFE"/>
        <path d="M4 19C4 16.79 5.79 15 8 15H12V23H8C5.79 23 4 21.21 4 19Z" fill="#0ACF83"/>
        <circle cx="8" cy="11" r="4" fill="#A259FF"/>
      </g>
      <text x="42" y="21" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Figma</text>
      <text x="42" y="33" fill="#C084FC" font-size="9.5" font-weight="600" class="font-mono">UI/UX Design</text>
    </g>

    <!-- 5. COURSERA CERTIFIED -->
    <g transform="translate(600, 0)">
      <rect x="0" y="0" width="158" height="42" rx="10" fill="#0C1322" stroke="#0056D2" stroke-opacity="0.6" stroke-width="1.2"/>
      <g transform="translate(14, 11)">
        <circle cx="10" cy="10" r="9" fill="#0056D2"/>
        <path d="M13 6.5C12.2 6.2 11.2 6 10 6C7.5 6 5.5 8 5.5 10.5C5.5 13 7.5 15 10 15C11.2 15 12.2 14.8 13 14.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="40" y="21" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">Coursera</text>
      <text x="40" y="33" fill="#93C5FD" font-size="9.5" font-weight="600" class="font-mono">Certified AI &amp; UX</text>
    </g>

    <!-- Location Pill -->
    <g transform="translate(770, 0)">
      <rect x="0" y="0" width="148" height="42" rx="10" fill="#080C14" stroke="#1E293B" stroke-width="1"/>
      <text x="74" y="20" text-anchor="middle" fill="#E2E8F0" font-size="11.5" font-weight="600" class="font-sans">Sana'a, Yemen</text>
      <text x="74" y="32" text-anchor="middle" fill="#60A5FA" font-size="9.5" font-weight="500" class="font-mono">UTC+3 • Remote</text>
    </g>

  </g>
</svg>
