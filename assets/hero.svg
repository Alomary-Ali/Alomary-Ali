<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="300" fill="none">
  <defs>
    <!-- Deep Space Obsidian Gradient -->
    <linearGradient id="bgMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="35%" stop-color="#080D1A"/>
      <stop offset="70%" stop-color="#0B0F24"/>
      <stop offset="100%" stop-color="#02040A"/>
    </linearGradient>

    <!-- Outer Frame Glow Border -->
    <linearGradient id="frameBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#4FACFE" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#7928CA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF0080" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Luminous Monogram Gradient -->
    <linearGradient id="brandLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>

    <!-- Text Gradient for Name -->
    <linearGradient id="nameTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="85%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Accent Highlights -->
    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Atmospheric Glow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32" result="blur"/>
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>

    <!-- Precision Dot Matrix Pattern -->
    <pattern id="dotMatrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.75" fill="#475569" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    .font-display {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    }
    .font-code {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace;
    }

    /* Ambient aura breathing */
    @keyframes auraBreathe {
      0%, 100% { opacity: 0.22; transform: scale(1); }
      50% { opacity: 0.38; transform: scale(1.08); }
    }
    .ambient-aura-1 {
      animation: auraBreathe 7s infinite ease-in-out;
      transform-origin: 180px 100px;
    }
    .ambient-aura-2 {
      animation: auraBreathe 9s infinite ease-in-out reverse;
      transform-origin: 780px 180px;
    }

    /* Radar Ping on Live Status */
    @keyframes radarPing {
      0% { r: 4px; opacity: 1; }
      75%, 100% { r: 12px; opacity: 0; }
    }
    .radar-wave {
      animation: radarPing 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
      transform-origin: 752px 38px;
    }

    /* Smooth Dynamic Subtitle Carousel */
    @keyframes slideRole1 {
      0%, 20% { opacity: 1; transform: translateY(0px); }
      24%, 96% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0px); }
    }
    @keyframes slideRole2 {
      0%, 21% { opacity: 0; transform: translateY(-8px); }
      25%, 45% { opacity: 1; transform: translateY(0px); }
      49%, 100% { opacity: 0; transform: translateY(8px); }
    }
    @keyframes slideRole3 {
      0%, 46% { opacity: 0; transform: translateY(-8px); }
      50%, 70% { opacity: 1; transform: translateY(0px); }
      74%, 100% { opacity: 0; transform: translateY(8px); }
    }
    @keyframes slideRole4 {
      0%, 71% { opacity: 0; transform: translateY(-8px); }
      75%, 95% { opacity: 1; transform: translateY(0px); }
      99%, 100% { opacity: 0; transform: translateY(8px); }
    }

    .role-1 { animation: slideRole1 16s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .role-2 { animation: slideRole2 16s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .role-3 { animation: slideRole3 16s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .role-4 { animation: slideRole4 16s infinite cubic-bezier(0.16, 1, 0.3, 1); }

    /* Hairline border sweep */
    @keyframes sweepGlow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .frame-highlight {
      animation: sweepGlow 4s infinite ease-in-out;
    }
  </style>

  <!-- Ambient Light Fields (Aurora) -->
  <circle class="ambient-aura-1" cx="180" cy="110" r="140" fill="#00F2FE" filter="url(#softGlow)"/>
  <circle class="ambient-aura-2" cx="780" cy="170" r="150" fill="#7928CA" filter="url(#softGlow)"/>

  <!-- Canvas Base -->
  <rect x="1.5" y="1.5" width="957" height="297" rx="20" fill="url(#bgMesh)" stroke="url(#frameBorder)" stroke-width="1.5"/>
  <rect x="3" y="3" width="954" height="294" rx="18" fill="url(#dotMatrix)"/>

  <!-- Top Glass Bar -->
  <g transform="translate(32, 24)">
    <!-- Terminal Indicators -->
    <circle cx="6" cy="14" r="5" fill="#EF4444" fill-opacity="0.85"/>
    <circle cx="24" cy="14" r="5" fill="#F59E0B" fill-opacity="0.85"/>
    <circle cx="42" cy="14" r="5" fill="#10B981" fill-opacity="0.85"/>

    <!-- Subtle Breadcrumb -->
    <text x="64" y="18" fill="#64748B" font-size="11.5" font-weight="600" class="font-code" letter-spacing="0.5">
      <tspan fill="#38BDF8">alomary</tspan><tspan fill="#475569"> / </tspan><tspan fill="#94A3B8">portfolio-spec.v2</tspan>
    </text>
  </g>

  <!-- Live Status Badge (Top-Right) -->
  <g transform="translate(710, 24)">
    <rect x="0" y="0" width="218" height="28" rx="14" fill="#030A14" fill-opacity="0.8" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Radar Waves -->
    <circle class="radar-wave" cx="20" cy="14" r="4" stroke="#00F2FE" stroke-width="1.5" fill="none"/>
    <circle cx="20" cy="14" r="3.5" fill="#00F2FE"/>
    <text x="36" y="18" fill="#E0F2FE" font-size="11" font-weight="700" class="font-code" letter-spacing="0.8">AVAILABLE FOR WORK</text>
  </g>

  <!-- Hairline Divider -->
  <line x1="32" y1="64" x2="928" y2="64" stroke="#1E293B" stroke-width="1" stroke-opacity="0.8"/>

  <!-- ================= MAIN IDENTITY SECTION ================= -->

  <!-- Bespoke AQ Geometric Brand Emblem -->
  <g transform="translate(42, 94)">
    <!-- Ambient Shadow Behind Logo -->
    <rect x="0" y="0" width="76" height="76" rx="20" fill="#00F2FE" fill-opacity="0.15" filter="url(#badgeGlow)"/>
    <!-- Glass Logo Tile -->
    <rect x="0" y="0" width="76" height="76" rx="20" fill="#060B17" stroke="url(#brandLogoGrad)" stroke-width="2"/>
    <!-- Geometric 'AQ' Monogram Vectors -->
    <!-- Vector A -->
    <path d="M22 52L34 24L46 52" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 44H42" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Vector Q loop -->
    <path d="M46 36C46 30 50 25 56 25C62 25 66 30 66 36C66 43 62 48 56 48C53 48 50 47 48 45" stroke="#7928CA" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M54 44L63 53" stroke="#FF0080" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- Typography: Name & Animated Roles -->
  <g transform="translate(136, 114)">
    <!-- Super-Title / Engineering Focus -->
    <text x="0" y="2" fill="#38BDF8" font-size="11" font-weight="700" class="font-code" letter-spacing="2">SENIOR FULL-STACK DEVELOPER • ARCHITECT &amp; UI/UX</text>

    <!-- Primary Signature Name -->
    <text x="0" y="36" fill="url(#nameTextGrad)" font-size="34" font-weight="800" class="font-display" letter-spacing="-0.8">Ali Qaid Saeed Alomary</text>

    <!-- Animated Subtitle Carousel -->
    <!-- Slide 1 -->
    <g class="role-1">
      <text x="0" y="66" fill="#F8FAFC" font-size="14.5" font-weight="600" class="font-code">
        <tspan fill="#00F2FE">&gt; </tspan>
        <tspan fill="#38BDF8">Flutter Mobile</tspan>
        <tspan fill="#64748B"> &amp; </tspan>
        <tspan fill="#FB7185">Laravel Backend</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#94A3B8">End-to-End Enterprise Systems</tspan>
      </text>
    </g>
    <!-- Slide 2 -->
    <g class="role-2">
      <text x="0" y="66" fill="#F8FAFC" font-size="14.5" font-weight="600" class="font-code">
        <tspan fill="#818CF8">&gt; </tspan>
        <tspan fill="#A5B4FC">Clean Architecture</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#E2E8F0">Feature-First Architecture &amp; SOLID Design</tspan>
      </text>
    </g>
    <!-- Slide 3 -->
    <g class="role-3">
      <text x="0" y="66" fill="#F8FAFC" font-size="14.5" font-weight="600" class="font-code">
        <tspan fill="#06B6D4">&gt; </tspan>
        <tspan fill="#22D3EE">Secure RESTful APIs</tspan>
        <tspan fill="#64748B"> &amp; </tspan>
        <tspan fill="#FCD34D">Optimized MySQL Relational Schemas</tspan>
      </text>
    </g>
    <!-- Slide 4 -->
    <g class="role-4">
      <text x="0" y="66" fill="#F8FAFC" font-size="14.5" font-weight="600" class="font-code">
        <tspan fill="#C084FC">&gt; </tspan>
        <tspan fill="#E9D5FF">Pixel-Perfect UI</tspan>
        <tspan fill="#64748B"> • </tspan>
        <tspan fill="#F1F5F9">Transforming Figma Prototypes into Fluid Apps</tspan>
      </text>
    </g>
  </g>

  <!-- ================= BOTTOM BRAND PILLARS ================= -->
  <g transform="translate(42, 222)">
    <!-- Pillar 1: Mobile -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="42" rx="10" fill="#080E1C" stroke="#0284C7" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#38BDF8"/>
      <text x="32" y="20" fill="#F1F5F9" font-size="11.5" font-weight="700" class="font-display">Flutter Mobile</text>
      <text x="32" y="32" fill="#38BDF8" font-size="9.5" font-weight="600" class="font-code">Dart • State Mgmt</text>
    </g>

    <!-- Pillar 2: Backend -->
    <g transform="translate(174, 0)">
      <rect x="0" y="0" width="160" height="42" rx="10" fill="#140A12" stroke="#E11D48" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#FB7185"/>
      <text x="32" y="20" fill="#F1F5F9" font-size="11.5" font-weight="700" class="font-display">Laravel Backend</text>
      <text x="32" y="32" fill="#FB7185" font-size="9.5" font-weight="600" class="font-code">REST APIs • RBAC</text>
    </g>

    <!-- Pillar 3: Architecture -->
    <g transform="translate(348, 0)">
      <rect x="0" y="0" width="180" height="42" rx="10" fill="#0E0E22" stroke="#6366F1" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#818CF8"/>
      <text x="32" y="20" fill="#F1F5F9" font-size="11.5" font-weight="700" class="font-display">Clean Architecture</text>
      <text x="32" y="32" fill="#A5B4FC" font-size="9.5" font-weight="600" class="font-code">Feature-First • SOLID</text>
    </g>

    <!-- Pillar 4: UI/UX Precision -->
    <g transform="translate(542, 0)">
      <rect x="0" y="0" width="180" height="42" rx="10" fill="#160A22" stroke="#A855F7" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#C084FC"/>
      <text x="32" y="20" fill="#F1F5F9" font-size="11.5" font-weight="700" class="font-display">Figma Design</text>
      <text x="32" y="32" fill="#D8B4FE" font-size="9.5" font-weight="600" class="font-code">Pixel-Perfect Specs</text>
    </g>

    <!-- Timezone & Location Chip -->
    <g transform="translate(736, 0)">
      <rect x="0" y="0" width="140" height="42" rx="10" fill="#040810" stroke="#1E293B" stroke-width="1"/>
      <text x="70" y="20" text-anchor="middle" fill="#CBD5E1" font-size="11" font-weight="600" class="font-display">Sana'a, Yemen</text>
      <text x="70" y="32" text-anchor="middle" fill="#64748B" font-size="9.5" font-weight="500" class="font-code">UTC+3 Remote Ready</text>
    </g>
  </g>
</svg>
