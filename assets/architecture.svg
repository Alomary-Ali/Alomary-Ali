<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="210" fill="none">
  <defs>
    <!-- Coursera Deep Navy Gradient -->
    <linearGradient id="crPipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A"/>
      <stop offset="50%" stop-color="#091427"/>
      <stop offset="100%" stop-color="#040813"/>
    </linearGradient>

    <!-- Node Surface Fill -->
    <linearGradient id="crNodeSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C1B36" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#071022" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="crNodeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056D2" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Dot Grid -->
    <pattern id="crArchGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.75" fill="#3B82F6" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }

    /* Animated Coursera Blue pulse data path */
    @keyframes crDataFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .cr-flow-line {
      stroke-dasharray: 5 5;
      animation: crDataFlow 2s linear infinite;
    }

    @keyframes crPulseNode {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.85; }
    }
    .cr-node-box { animation: crPulseNode 4s infinite ease-in-out; }
  </style>

  <!-- Frame Base -->
  <rect x="1.5" y="1.5" width="957" height="207" rx="18" fill="url(#crPipeBg)" stroke="#1E3A8A" stroke-width="1.3"/>
  <rect x="3" y="3" width="954" height="204" rx="16" fill="url(#crArchGrid)"/>

  <!-- Header Bar -->
  <g transform="translate(32, 22)">
    <circle cx="4" cy="5" r="3.5" fill="#0056D2"/>
    <text x="16" y="9" fill="#93C5FD" font-size="11" font-weight="700" class="font-mono" letter-spacing="1.5">END-TO-END SYSTEM PIPELINE &amp; ARCHITECTURAL INTEGRITY</text>
    <text x="896" y="9" text-anchor="end" fill="#60A5FA" font-size="10" font-weight="600" class="font-mono">FIGMA ➔ FLUTTER ➔ REST API ➔ LARAVEL ➔ MYSQL</text>
  </g>

  <!-- Flow Lines Connecting the 5 Stages -->
  <line class="cr-flow-line" x1="194" y1="116" x2="222" y2="116" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  <line class="cr-flow-line" x1="384" y1="116" x2="412" y2="116" stroke="#0056D2" stroke-width="2.2" stroke-linecap="round"/>
  <line class="cr-flow-line" x1="574" y1="116" x2="602" y2="116" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  <line class="cr-flow-line" x1="764" y1="116" x2="792" y2="116" stroke="#0056D2" stroke-width="2.2" stroke-linecap="round"/>

  <!-- ================= NODE 01: FIGMA UI/UX ================= -->
  <g transform="translate(32, 48)">
    <rect class="cr-node-box" x="0" y="0" width="162" height="136" rx="12" fill="url(#crNodeSurface)" stroke="url(#crNodeBorder)" stroke-width="1.3"/>
    <g transform="translate(14, 14)">
      <!-- Official Figma Vector Logo -->
      <g transform="translate(0, 0) scale(0.9)">
        <path d="M4 11C4 8.79 5.79 7 8 7H12V15H8C5.79 15 4 13.21 4 11Z" fill="#F24E1E"/>
        <path d="M12 7H16C18.21 7 20 8.79 20 11C20 13.21 18.21 15 16 15H12V7Z" fill="#FF7262"/>
        <path d="M12 15H16C18.21 15 20 16.79 20 19C20 21.21 18.21 23 16 23C13.79 23 12 21.21 12 19V15Z" fill="#1ABCFE"/>
        <path d="M4 19C4 16.79 5.79 15 8 15H12V23H8C5.79 23 4 21.21 4 19Z" fill="#0ACF83"/>
        <circle cx="8" cy="11" r="4" fill="#A259FF"/>
      </g>
      <text x="26" y="14" fill="#E2E8F0" font-size="11.5" font-weight="700" class="font-sans">01. Design</text>
      <!-- Title -->
      <text x="0" y="38" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">Figma System</text>
      <line x1="0" y1="48" x2="134" y2="48" stroke="#1E3A8A" stroke-width="1"/>
      <text x="0" y="66" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Pixel-Perfect Specs</text>
      <text x="0" y="82" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Design Tokens &amp; UX</text>
      <text x="0" y="98" fill="#38BDF8" font-size="9.5" font-weight="600" class="font-mono">PROTOTYPING</text>
    </g>
  </g>

  <!-- ================= NODE 02: FLUTTER MOBILE ================= -->
  <g transform="translate(222, 48)">
    <rect class="cr-node-box" x="0" y="0" width="162" height="136" rx="12" fill="url(#crNodeSurface)" stroke="url(#crNodeBorder)" stroke-width="1.3"/>
    <g transform="translate(14, 14)">
      <!-- Official Flutter Vector Logo -->
      <g transform="translate(0, 0) scale(0.78)">
        <path d="M14.314 0L2.3 12 6 15.7 21.684.013h-7.37z" fill="#54C5F8"/>
        <path d="M14.287 10.978L6.46 18.807 10.16 22.507 17.986 14.678h-3.699z" fill="#29B6F6"/>
        <path d="M10.158 22.508L14.288 26.638H21.688L14.774 19.724 10.158 22.508z" fill="#01579B"/>
        <path d="M14.774 19.724L17.986 14.678H21.686L17.572 18.792z" fill="#0288D1"/>
      </g>
      <text x="26" y="14" fill="#E2E8F0" font-size="11.5" font-weight="700" class="font-sans">02. Client</text>
      <!-- Title -->
      <text x="0" y="38" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">Flutter / Dart</text>
      <line x1="0" y1="48" x2="134" y2="48" stroke="#1E3A8A" stroke-width="1"/>
      <text x="0" y="66" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Clean Architecture</text>
      <text x="0" y="82" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Feature-First Pattern</text>
      <text x="0" y="98" fill="#60A5FA" font-size="9.5" font-weight="600" class="font-mono">IOS &amp; ANDROID</text>
    </g>
  </g>

  <!-- ================= NODE 03: RESTFUL API GATEWAY ================= -->
  <g transform="translate(412, 48)">
    <rect class="cr-node-box" x="0" y="0" width="162" height="136" rx="12" fill="url(#crNodeSurface)" stroke="url(#crNodeBorder)" stroke-width="1.3"/>
    <g transform="translate(14, 14)">
      <!-- Official API Arrows Vector -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="20" height="20" rx="4" fill="#0056D2" fill-opacity="0.3"/>
        <path d="M4 8H16M16 8L13 5M16 8L13 11" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 13H4M4 13L7 10M4 13L7 16" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="26" y="14" fill="#E2E8F0" font-size="11.5" font-weight="700" class="font-sans">03. Gateway</text>
      <!-- Title -->
      <text x="0" y="38" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">RESTful APIs</text>
      <line x1="0" y1="48" x2="134" y2="48" stroke="#1E3A8A" stroke-width="1"/>
      <text x="0" y="66" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• JSON Contracts</text>
      <text x="0" y="82" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Postman Verified</text>
      <text x="0" y="98" fill="#38BDF8" font-size="9.5" font-weight="600" class="font-mono">SECURE TRANSIT</text>
    </g>
  </g>

  <!-- ================= NODE 04: LARAVEL BACKEND ================= -->
  <g transform="translate(602, 48)">
    <rect class="cr-node-box" x="0" y="0" width="162" height="136" rx="12" fill="url(#crNodeSurface)" stroke="url(#crNodeBorder)" stroke-width="1.3"/>
    <g transform="translate(14, 14)">
      <!-- Official Laravel Vector Logo -->
      <g transform="translate(0, 0) scale(0.75)">
        <path d="M2.5 7.5L12 2L21.5 7.5V18.5L12 24L2.5 18.5V7.5Z" fill="#FF2D20"/>
        <path d="M12 2V24M2.5 7.5L21.5 18.5M2.5 18.5L21.5 7.5" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5"/>
      </g>
      <text x="26" y="14" fill="#E2E8F0" font-size="11.5" font-weight="700" class="font-sans">04. Core Engine</text>
      <!-- Title -->
      <text x="0" y="38" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">Laravel / PHP</text>
      <line x1="0" y1="48" x2="134" y2="48" stroke="#1E3A8A" stroke-width="1"/>
      <text x="0" y="66" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Business Logic</text>
      <text x="0" y="82" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Security &amp; RBAC</text>
      <text x="0" y="98" fill="#FB7185" font-size="9.5" font-weight="600" class="font-mono">ENTERPRISE SCALE</text>
    </g>
  </g>

  <!-- ================= NODE 05: MYSQL DATABASE ================= -->
  <g transform="translate(792, 48)">
    <rect class="cr-node-box" x="0" y="0" width="136" height="136" rx="12" fill="url(#crNodeSurface)" stroke="url(#crNodeBorder)" stroke-width="1.3"/>
    <g transform="translate(14, 14)">
      <!-- Official MySQL DB Vector Logo -->
      <g transform="translate(0, 0) scale(0.9)">
        <ellipse cx="10" cy="5" rx="9" ry="3.5" fill="#00758F"/>
        <path d="M1 5V13C1 15 5 16.5 10 16.5C15 16.5 19 15 19 13V5" stroke="#F29111" stroke-width="1.8" fill="none"/>
        <path d="M1 9C1 11 5 12.5 10 12.5C15 12.5 19 11 19 9" stroke="#00758F" stroke-width="1.4" fill="none"/>
      </g>
      <text x="24" y="14" fill="#E2E8F0" font-size="11.5" font-weight="700" class="font-sans">05. Storage</text>
      <!-- Title -->
      <text x="0" y="38" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">MySQL DB</text>
      <line x1="0" y1="48" x2="108" y2="48" stroke="#1E3A8A" stroke-width="1"/>
      <text x="0" y="66" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Relational DB</text>
      <text x="0" y="82" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Query Optimize</text>
      <text x="0" y="98" fill="#FBBF24" font-size="9.5" font-weight="600" class="font-mono">INTEGRITY</text>
    </g>
  </g>
</svg>
