<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="210" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#070C1A"/>
      <stop offset="100%" stop-color="#02050D"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="pipeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF0080" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1527" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#060B14" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="pipeGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.6" fill="#334155" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }

    /* Animated data packet traveling across the pipeline */
    @keyframes dataDash {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .pipe-line {
      stroke-dasharray: 5 5;
      animation: dataDash 2s linear infinite;
    }

    @keyframes pulseNode {
      0%, 100% { stroke-opacity: 0.35; }
      50% { stroke-opacity: 0.85; }
    }
    .node-glow { animation: pulseNode 3.5s infinite ease-in-out; }
  </style>

  <!-- Base Canvas -->
  <rect x="1.5" y="1.5" width="957" height="207" rx="18" fill="url(#pipeBg)" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="3" y="3" width="954" height="204" rx="16" fill="url(#pipeGrid)"/>

  <!-- Top System Header -->
  <g transform="translate(32, 22)">
    <circle cx="4" cy="5" r="3" fill="#00F2FE"/>
    <text x="16" y="9" fill="#F8FAFC" font-size="11" font-weight="700" class="font-mono" letter-spacing="1.5">END-TO-END SYSTEM PIPELINE &amp; ARCHITECTURAL INTEGRITY</text>
    <text x="896" y="9" text-anchor="end" fill="#64748B" font-size="10" font-weight="600" class="font-mono">FIGMA ➔ FLUTTER ➔ REST API ➔ LARAVEL ➔ MYSQL</text>
  </g>

  <!-- Connecting Animated Flow Traces -->
  <!-- 1 -> 2 -->
  <line class="pipe-line" x1="194" y1="116" x2="222" y2="116" stroke="#C084FC" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 2 -> 3 -->
  <line class="pipe-line" x1="384" y1="116" x2="412" y2="116" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 3 -> 4 -->
  <line class="pipe-line" x1="574" y1="116" x2="602" y2="116" stroke="#2DD4BF" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 4 -> 5 -->
  <line class="pipe-line" x1="764" y1="116" x2="792" y2="116" stroke="#FB7185" stroke-width="2.2" stroke-linecap="round"/>

  <!-- ================= STAGE 01: DESIGN ================= -->
  <g transform="translate(32, 48)">
    <rect class="node-glow" x="0" y="0" width="162" height="136" rx="12" fill="url(#cardSurface)" stroke="#C084FC" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <!-- Stage Badge -->
      <rect x="0" y="0" width="24" height="18" rx="4" fill="#3B0764" stroke="#C084FC" stroke-width="0.8"/>
      <text x="12" y="13" text-anchor="middle" fill="#E9D5FF" font-size="10" font-weight="700" class="font-mono">01</text>
      <text x="32" y="14" fill="#E9D5FF" font-size="11" font-weight="700" class="font-mono">UI/UX SPECS</text>
      <!-- Title -->
      <text x="0" y="38" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">Figma System</text>
      <line x1="0" y1="48" x2="134" y2="48" stroke="#1E293B" stroke-width="1"/>
      <!-- Details -->
      <text x="0" y="66" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Pixel-Perfect Specs</text>
      <text x="0" y="82" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Design Tokens</text>
      <text x="0" y="98" fill="#A855F7" font-size="9.5" font-weight="600" class="font-mono">USER EXPERIENCE</text>
    </g>
  </g>

  <!-- ================= STAGE 02: CLIENT ================= -->
  <g transform="translate(222, 48)">
    <rect class="node-glow" x="0" y="0" width="162" height="136" rx="12" fill="url(#cardSurface)" stroke="#00F2FE" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <!-- Stage Badge -->
      <rect x="0" y="0" width="24" height="18" rx="4" fill="#082F49" stroke="#00F2FE" stroke-width="0.8"/>
      <text x="12" y="13" text-anchor="middle" fill="#BAE6FD" font-size="10" font-weight="700" class="font-mono">02</text>
      <text x="32" y="14" fill="#BAE6FD" font-size="11" font-weight="700" class="font-mono">CLIENT APP</text>
      <!-- Title -->
      <text x="0" y="38" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">Flutter / Dart</text>
      <line x1="0" y1="48" x2="134" y2="48" stroke="#1E293B" stroke-width="1"/>
      <!-- Details -->
      <text x="0" y="66" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Clean Architecture</text>
      <text x="0" y="82" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Feature-First Pattern</text>
      <text x="0" y="98" fill="#38BDF8" font-size="9.5" font-weight="600" class="font-mono">IOS &amp; ANDROID</text>
    </g>
  </g>

  <!-- ================= STAGE 03: GATEWAY ================= -->
  <g transform="translate(412, 48)">
    <rect class="node-glow" x="0" y="0" width="162" height="136" rx="12" fill="url(#cardSurface)" stroke="#2DD4BF" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <!-- Stage Badge -->
      <rect x="0" y="0" width="24" height="18" rx="4" fill="#042F2E" stroke="#2DD4BF" stroke-width="0.8"/>
      <text x="12" y="13" text-anchor="middle" fill="#99F6E4" font-size="10" font-weight="700" class="font-mono">03</text>
      <text x="32" y="14" fill="#99F6E4" font-size="11" font-weight="700" class="font-mono">INTEGRATION</text>
      <!-- Title -->
      <text x="0" y="38" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">RESTful APIs</text>
      <line x1="0" y1="48" x2="134" y2="48" stroke="#1E293B" stroke-width="1"/>
      <!-- Details -->
      <text x="0" y="66" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• JSON Contracts</text>
      <text x="0" y="82" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Postman Verified</text>
      <text x="0" y="98" fill="#2DD4BF" font-size="9.5" font-weight="600" class="font-mono">SECURE TRANSIT</text>
    </g>
  </g>

  <!-- ================= STAGE 04: BACKEND ================= -->
  <g transform="translate(602, 48)">
    <rect class="node-glow" x="0" y="0" width="162" height="136" rx="12" fill="url(#cardSurface)" stroke="#FB7185" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <!-- Stage Badge -->
      <rect x="0" y="0" width="24" height="18" rx="4" fill="#4C0519" stroke="#FB7185" stroke-width="0.8"/>
      <text x="12" y="13" text-anchor="middle" fill="#FECDD3" font-size="10" font-weight="700" class="font-mono">04</text>
      <text x="32" y="14" fill="#FECDD3" font-size="11" font-weight="700" class="font-mono">CORE ENGINE</text>
      <!-- Title -->
      <text x="0" y="38" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">Laravel / PHP</text>
      <line x1="0" y1="48" x2="134" y2="48" stroke="#1E293B" stroke-width="1"/>
      <!-- Details -->
      <text x="0" y="66" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Business Logic</text>
      <text x="0" y="82" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• RBAC &amp; Security</text>
      <text x="0" y="98" fill="#F43F5E" font-size="9.5" font-weight="600" class="font-mono">ENTERPRISE SCALE</text>
    </g>
  </g>

  <!-- ================= STAGE 05: PERSISTENCE ================= -->
  <g transform="translate(792, 48)">
    <rect class="node-glow" x="0" y="0" width="136" height="136" rx="12" fill="url(#cardSurface)" stroke="#FCD34D" stroke-width="1.2"/>
    <g transform="translate(14, 14)">
      <!-- Stage Badge -->
      <rect x="0" y="0" width="24" height="18" rx="4" fill="#451A03" stroke="#FCD34D" stroke-width="0.8"/>
      <text x="12" y="13" text-anchor="middle" fill="#FEF3C7" font-size="10" font-weight="700" class="font-mono">05</text>
      <text x="32" y="14" fill="#FEF3C7" font-size="11" font-weight="700" class="font-mono">STORAGE</text>
      <!-- Title -->
      <text x="0" y="38" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">MySQL DB</text>
      <line x1="0" y1="48" x2="108" y2="48" stroke="#1E293B" stroke-width="1"/>
      <!-- Details -->
      <text x="0" y="66" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Relational DB</text>
      <text x="0" y="82" fill="#CBD5E1" font-size="10.5" font-weight="500" class="font-sans">• Optimization</text>
      <text x="0" y="98" fill="#F59E0B" font-size="9.5" font-weight="600" class="font-mono">INTEGRITY</text>
    </g>
  </g>
</svg>
