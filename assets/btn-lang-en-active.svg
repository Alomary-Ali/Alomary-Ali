<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 44" width="190" height="44" fill="none">
  <defs>
    <!-- Frosted Glass Surface -->
    <linearGradient id="activeEnSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070C16" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="activeEnBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0056D2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <style>
    .font-en {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
    }
  </style>

  <!-- Button Frame -->
  <rect x="1" y="1" width="188" height="42" rx="12" fill="url(#activeEnSurface)" stroke="url(#activeEnBorder)" stroke-width="1.2"/>

  <!-- Left: Globe / Flag Icon -->
  <g transform="translate(16, 12)">
    <!-- Flag / Shield Icon -->
    <rect x="0" y="2" width="18" height="15" rx="3" fill="#1E293B" stroke="#60A5FA" stroke-width="1"/>
    <line x1="0" y1="7" x2="18" y2="7" stroke="#38BDF8" stroke-width="1"/>
    <line x1="0" y1="12" x2="18" y2="12" stroke="#38BDF8" stroke-width="1"/>
    <rect x="0" y="2" width="8" height="8" rx="2" fill="#0056D2"/>
  </g>

  <!-- Text: English -->
  <text x="44" y="26" fill="#F8FAFC" font-size="13.5" font-weight="700" class="font-en">English</text>

  <!-- Active Status Tag (Pill) -->
  <g transform="translate(108, 12)">
    <rect x="0" y="0" width="66" height="20" rx="10" fill="#0056D2" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="0.8"/>
    <circle cx="12" cy="10" r="3" fill="#38BDF8"/>
    <text x="21" y="14" fill="#93C5FD" font-size="10" font-weight="600" class="font-mono">ACTIVE</text>
  </g>
</svg>
