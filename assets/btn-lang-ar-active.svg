<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 44" width="190" height="44" fill="none">
  <defs>
    <!-- Frosted Surface -->
    <linearGradient id="activeArSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070C16" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="activeArBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0056D2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <style>
    .font-ar {
      font-family: 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
    }
  </style>

  <!-- Button Frame -->
  <rect x="1" y="1" width="188" height="42" rx="12" fill="url(#activeArSurface)" stroke="url(#activeArBorder)" stroke-width="1.2"/>

  <!-- Left: Globe Icon -->
  <g transform="translate(16, 12)">
    <circle cx="10" cy="10" r="9" stroke="#60A5FA" stroke-width="1.3" fill="none"/>
    <ellipse cx="10" cy="10" rx="4.5" ry="9" stroke="#60A5FA" stroke-width="1.2" fill="none"/>
    <line x1="1" y1="10" x2="19" y2="10" stroke="#60A5FA" stroke-width="1.2"/>
  </g>

  <!-- Text: العربية -->
  <text x="44" y="27" fill="#F8FAFC" font-size="14" font-weight="700" class="font-ar">العربية</text>

  <!-- Active Status Tag -->
  <g transform="translate(104, 12)">
    <rect x="0" y="0" width="70" height="20" rx="10" fill="#0056D2" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="0.8"/>
    <circle cx="12" cy="10" r="3" fill="#38BDF8"/>
    <text x="22" y="14" fill="#93C5FD" font-size="10.5" font-weight="700" class="font-ar">الحالية</text>
  </g>
</svg>
